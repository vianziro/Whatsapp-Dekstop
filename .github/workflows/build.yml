name: Release

# MANUAL ONLY — do not re-add a tag trigger.
#
# This workflow used to run on every `v*` tag. Hosted runners require a healthy
# account, and while the repository owner's account is locked for billing
# reasons every tag push produced a failed run in four seconds (the `prepare`
# job never started, so all build jobs were skipped and `publish` never ran).
# Releases are therefore built and published from a local machine with
# `bash release.sh <version>`, which produces the same artifacts and uploads
# them with SHA256SUMS.
#
# The job definitions below are kept intact so the workflow can be run by hand
# from the Actions tab (or with `gh workflow run`) whenever hosted runners are
# available again. Re-adding the tag trigger without fixing the account would
# only restore the failing runs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || {
            echo "Invalid version: $VERSION"; exit 1;
          }
          grep -Fq "var appVersion = \"${VERSION}\"" updater.go || {
            echo "updater.go appVersion must match release version ${VERSION}"; exit 1;
          }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build macOS bundle
        run: bash build_mac.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            WhatsApp-Desk-macOS-Universal.dmg
            WhatsApp-Desk-macOS-Universal.zip

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build Windows binary and installer
        shell: bash
        run: bash build.sh windows "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            WhatsAppDesk.exe
            WhatsApp-Desk-Windows-x64.zip
            WhatsApp-Desk-Windows-x64-Setup.exe

  linux-x64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install WebKitGTK deps
        # `rpm` supplies rpmbuild so the Fedora/RHEL package is produced on the
        # same runner as the DEB and tarball, instead of being uploaded by hand.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev rpm
      - name: Build Linux packages
        env:
          WA_DESK_BUILD_RPM: "1"
        run: bash build_linux.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            WhatsApp-Desk-Linux-x64.tar.gz
            WhatsApp-Desk-Linux-amd64.deb
            WhatsApp-Desk-Fedora-x64.rpm

  # Opt-in WebKitGTK 4.1 variant for Ubuntu 24.04 Noble, Linux Mint 22.x and
  # current Fedora. Added alongside (not replacing) the historical 4.0 jobs so
  # Jammy/Debian support is unchanged. Related to issues #8 and #9.
  linux-x64-webkit41:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install WebKitGTK 4.1 deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm
      - name: Build Linux packages (WebKit 4.1)
        env:
          WA_DESK_BUILD_RPM: "1"
          WA_DESK_WEBKIT: "4.1"
        run: bash build_linux.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-webkit41
          path: |
            WhatsApp-Desk-Linux-x64-webkit4.1.tar.gz
            WhatsApp-Desk-Linux-amd64-webkit4.1.deb
            WhatsApp-Desk-Fedora-x64-webkit4.1.rpm

  linux-arm64:
    needs: prepare
    # GitHub-hosted ARM runners are available for public repositories.
    # The embedded webview dependency links through the WebKitGTK 4.0 pkg-config
    # name, which is available on Jammy for arm64.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install WebKitGTK deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev rpm
      - name: Build Linux arm64 packages
        env:
          WA_DESK_BUILD_RPM: "1"
        run: bash build_linux.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            WhatsApp-Desk-Linux-arm64.tar.gz
            WhatsApp-Desk-Linux-arm64.deb
            WhatsApp-Desk-Fedora-arm64.rpm

  publish:
    needs: [prepare, macos, windows, linux-x64, linux-x64-webkit41, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          # One line per published artifact, GNU coreutils format, so users can
          # verify with: sha256sum -c SHA256SUMS  (shasum -c on macOS).
          # The in-app updater downloads this file and refuses to install an
          # artifact whose digest does not match.
          set -euo pipefail
          for f in WhatsAppDesk.exe \
                   WhatsApp-Desk-Windows-x64.zip \
                   WhatsApp-Desk-Windows-x64-Setup.exe \
                   WhatsApp-Desk-macOS-Universal.dmg \
                   WhatsApp-Desk-macOS-Universal.zip \
                   WhatsApp-Desk-Linux-x64.tar.gz \
                   WhatsApp-Desk-Linux-amd64.deb \
                   WhatsApp-Desk-Linux-x64-webkit4.1.tar.gz \
                   WhatsApp-Desk-Linux-amd64-webkit4.1.deb \
                   WhatsApp-Desk-Linux-arm64.tar.gz \
                   WhatsApp-Desk-Linux-arm64.deb \
                   WhatsApp-Desk-Fedora-x64.rpm \
                   WhatsApp-Desk-Fedora-x64-webkit4.1.rpm \
                   WhatsApp-Desk-Fedora-arm64.rpm; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS
            else
              echo "::warning::expected release asset missing: $f"
            fi
          done
          test -s SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/SHA256SUMS
            release-assets/WhatsAppDesk.exe
            release-assets/WhatsApp-Desk-Windows-x64.zip
            release-assets/WhatsApp-Desk-Windows-x64-Setup.exe
            release-assets/WhatsApp-Desk-macOS-Universal.dmg
            release-assets/WhatsApp-Desk-macOS-Universal.zip
            release-assets/WhatsApp-Desk-Linux-x64.tar.gz
            release-assets/WhatsApp-Desk-Linux-amd64.deb
            release-assets/WhatsApp-Desk-Linux-x64-webkit4.1.tar.gz
            release-assets/WhatsApp-Desk-Linux-amd64-webkit4.1.deb
            release-assets/WhatsApp-Desk-Linux-arm64.tar.gz
            release-assets/WhatsApp-Desk-Linux-arm64.deb
            release-assets/WhatsApp-Desk-Fedora-x64.rpm
            release-assets/WhatsApp-Desk-Fedora-x64-webkit4.1.rpm
            release-assets/WhatsApp-Desk-Fedora-arm64.rpm
